[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = deployment
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    --ignore=venv/lib/python3.12/site-packages/IPython/
    --ignore=venv/lib/python3.12/site-packages/numpy/
    --ignore=venv/lib/python3.12/site-packages/pandas/
    --ignore=venv/lib/python3.12/site-packages/numpy/conftest.py
    --ignore=venv/lib/python3.12/site-packages/pandas/conftest.py
    --ignore=venv/lib/python3.12/site-packages/pandas/tests/
    --ignore-glob=venv/lib/python3.12/site-packages/numpy/**/conftest.py
    --ignore-glob=venv/lib/python3.12/site-packages/pandas/**/conftest.py
    --import-mode=importlib
    --no-header
    --no-summary
markers =
    unit: 단위 테스트
    integration: 통합 테스트
    api: API 테스트
    performance: 성능 테스트
    slow: 느린 테스트
    ascr: ASCR 모듈 테스트
    excel: Excel 처리 테스트
    pdf: PDF 처리 테스트 